name: Validate marketplace plugin

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r plugins/programmer-resume-skill/requirements-dev.txt
      - run: python -m pytest plugins/programmer-resume-skill/tests/ -q
      - run: python plugins/programmer-resume-skill/scripts/validate.py --repository-root .
